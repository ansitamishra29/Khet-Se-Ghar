
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Khet Se Ghar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
   <div id="auth-language"></div>
    <section class="auth-section">

        <div class="auth-card">

            <div class="auth-logo">
                🌿 Khet Se Ghar
            </div>

            <h2 data-i18n="loginWelcome">Welcome Back!</h2>
<p class="auth-subtitle" data-i18n="loginSubtitle">
    Login to continue to your account.
</p>
            <form>
<label for="email" data-i18n="loginEmail">Email Address</label>
<input
    type="email"
    id="email"
    name="email"
    placeholder="Enter your email"
    data-i18n-placeholder="loginEmailPlaceholder"
    autocomplete="off"
    required
>

<div id="account-suggestions" class="account-suggestions"></div>


        <label for="password" data-i18n="loginPassword">Password</label>
             <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    data-i18n-placeholder="loginPasswordPlaceholder"
                    required
                >

                <button type="submit" class="auth-btn" data-i18n="loginButton">
             Login
               </button>

            </form>

            <p class="auth-switch">
    <span data-i18n="loginNoAccount">Don't have an account?</span>
    <a href="signup.html" data-i18n="loginSignup">Sign Up</a>
</p>

            <a href="index.html" class="back-home" data-i18n="loginBackHome">
    ← Back to Home
</a>

        </div>

    </section>

 <script src="js/translations.js"></script>
<script src="js/login.js"></script>

</body>
</html>
